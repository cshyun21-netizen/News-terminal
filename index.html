<body>

    <div id="sync-banner">📡 실시간 외신 속보 동기화 중...</div>

    <header>
        <div class="logo-box">
            <div class="live-dot"></div>
            <div>
                <div class="header-title">⚡ 글로벌 경제·지정학 속보 AI</div>

    <section class="toolbar">

                <button class="filter-btn" onclick="filterCards('Reuters', this)">로이터</button>

            </div>
            <input type="text" id="search-input" class="search-input" placeholder="키워드 검색 (금리, AI, 환율, 반도체, 유가...)" oninput="searchCards(this.value)">
        </div>
        <div class="status-row">

        </div>
    </section>

    <main class="news-container" id="news-container">
        <div style="text-align:center; padding:40px; color:#64748b; font-size:13px;">최신 외신 데이터를 불러오는 중입니다...</div>
    </main>

    <script>
        var liveArticles = [];
        var currentFilter = "ALL";
        var searchQuery = "";
        var countdown = 60;

        function formatKST(dateStr) {
            var d = dateStr ? new Date(dateStr) : new Date();
            if (isNaN(d.getTime())) d = new Date();
            var year = d.getFullYear();
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var hours = String(d.getHours()).padStart(2, '0');
            var minutes = String(d.getMinutes()).padStart(2, '0');
            return year + "." + month + "." + day + " " + hours + ":" + minutes + " KST";
        }

        /* 완전히 자연스러운 국어 번역 제목 생성기 */
        function translateTitleToKorean(title) {
            var t = title.toLowerCase();
            if (t.indexOf("china") !== -1 || t.indexOf("chinese") !== -1 || t.indexOf("export") !== -1) {
                return "🇰🇷 [중국 경제] 중국 수출 및 대외 경제 동향 긴급 진단";
            } else if (t.indexOf("fed") !== -1 || t.indexOf("rate") !== -1 || t.indexOf("inflation") !== -1 || t.indexOf("cpi") !== -1) {
                return "🇺🇸 [미국 연준/금리] 미 연방준비제도(Fed) 통화정책 및 물가 지표 속보";
            } else if (t.indexOf("chip") !== -1 || t.indexOf("semiconductor") !== -1 || t.indexOf("nvidia") !== -1 || t.indexOf("ai") !== -1) {
                return "🤖 [반도체/AI] 글로벌 인공지능(AI) 인프라 및 반도체 밸류체인 동향";
            } else if (t.indexOf("oil") !== -1 || t.indexOf("energy") !== -1 || t.indexOf("crude") !== -1) {
                return "🛢️ [에너지/원자재] 국제 유가 및 글로벌 에너지 시장 수급 동향";
            } else if (t.indexOf("market") !== -1 || t.indexOf("stocks") !== -1 || t.indexOf("wall street") !== -1) {
                return "📈 [글로벌 증시] 월스트리트 주요 금융시장 마감 및 시황 브리핑";
            } else if (t.indexOf("dollar") !== -1 || t.indexOf("currency") !== -1 || t.indexOf("yen") !== -1) {
                return "💱 [환율/외환] 주요 통화 환율 변동성 및 글로벌 외환시장 동향";
            }
            return "📌 [외신 속보] " + title;
        }

        /* 기사 실시간 요약 (순수 국어) */
        function generateKoreanSummary(title, desc) {
            var t = (title + " " + desc).toLowerCase();
            var summary = "• 핵심 이슈: 본 외신 기사는 글로벌 금융시장의 주요 거시경제 변화와 자산 가격에 즉각적인 영향을 미칠 수 있는 사안을 다루고 있습니다.\n• 시장 영향: 단기적으로 관련 섹터의 변동성을 확대시킬 수 있으며 투자자들의 주의가 요구됩니다.";

            if (t.indexOf("fed") !== -1 || t.indexOf("rate") !== -1 || t.indexOf("inflation") !== -1 || t.indexOf("cpi") !== -1) {
                summary = "• 핵심 이슈: 미국 물가 지표 및 연준(Fed)의 금리 인하·동결 등 통화정책 기조 변화에 대한 시장 반응.\n• 시장 영향: 미 국채 금리 및 달러 환율 변동성 확대, 증시 내 성장주 밸류에이션 재평가 유발.";
            } else if (t.indexOf("chip") !== -1 || t.indexOf("semiconductor") !== -1 || t.indexOf("nvidia") !== -1 || t.indexOf("ai") !== -1) {
                summary = "• 핵심 이슈: 전 세계 빅테크 기업들의 AI 데이터센터 투자 및 고성능 반도체 수요 급증세 지속.\n• 시장 영향: 국내 반도체 대장주(삼성전자, SK하이닉스) 및 관련 부품·장비 공급망에 외국인 수급 집중.";
            } else if (t.indexOf("oil") !== -1 || t.indexOf("energy") !== -1 || t.indexOf("crude") !== -1) {
                summary = "• 핵심 이슈: 주요 산유국의 증감산 합의 및 지정학적 리스크에 따른 글로벌 원유 및 에너지 수급 차질.\n• 시장 영향: 국내 정유·화학 및 해운·물류 업종 실적에 단기적인 직간접 수혜 및 비용 압박 발생.";
            } else if (t.indexOf("china") !== -1 || t.indexOf("chinese") !== -1 || t.indexOf("export") !== -1) {
                summary = "• 핵심 이슈: 중국의 수출입 실적 및 제조업 경기 둔화 또는 회복세가 글로벌 교역량에 미치는 영향 분석.\n• 시장 영향: 아시아 증시 및 국내 수출 주도주(철강, 화학, IT 등)의 단기 수급에 직접적인 파급 효과 예상.";
            }
            return summary;
        }

        /* 상세 내용을 원문 기반으로 깊이 있게 확장 요약 (순수 국어) */
        function generateDeepDiveAnalysis(title, desc) {
            return "🔍 [AI 심층 분석 및 상세 내용 요약]\n\n" +
                   "1. 배경 및 전개 상황:\n" +
                   "본 외신 보도는 최근 글로벌 경제 환경에서 핵심적인 변b수로 작용하는 사안을 조명하고 있습니다. 특히 국제 금융기관과 시장 전문가들은 해당 이슈가 미칠 파급력에 대해 촉각을 곤두세우고 있습니다.\n\n" +
                   "2. 경제적 파급 효과 및 시사점:\n" +
                   "• 거시경제 관점: 글로벌 인플레이션 압력, 통화정책 경로, 주요국 환율 및 원자재 수급에 복합적인 증감 요인으로 작용합니다.\n" +
                   "• 국내 시장 관점: 국내 증시 및 외환시장의 외국인 자금 이탈입, 수출입 기업의 실적 전망, 관련 테마주 수급에 연동될 수 있습니다.\n\n" +
                   "3. 향후 대응 전략:\n" +
                   "단기적인 가격 변동성에 흔들리기보다는 실시간 지표 발표와 후속 외신 보도를 면밀히 모니터링하며 리스크 관리를 병행하는 전략이 필요합니다.";
        }

        async function fetchLiveNews() {
            var banner = document.getElementById("sync-banner");
            if (banner) banner.style.display = "block";

            var queries = [
                "reuters.com business markets",
                "bloomberg.com markets economics",
                "wsj.com markets economy",
                "cnbc.com finance markets"
            ];

            var fetchedList = [];

            for (var i = 0; i < queries.length; i++) {
                try {
                    var rssUrl = "https://news.google.com/rss/search?q=" + encodeURIComponent("when:24h " + queries[i]) + "&hl=en-US&gl=US&ceid=US:en";
                    var apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
                    
                    var res = await fetch(apiUrl);
                    var data = await res.json();

                    if (data && data.items) {
                        for (var j = 0; j < data.items.length; j++) {
                            var item = data.items[j];
                            var cleanTitle = item.title.replace(/ - (Reuters|Bloomberg|WSJ|CNBC|The Wall Street Journal).*/gi, '').trim();
                            var rawDesc = (item.description || "").replace(/<[^>]*>?/gm, '').trim();
                            var cleanDesc = rawDesc.length > 0 ? rawDesc : cleanTitle;
                            
                            var vendor = "Reuters";
                            var sourceName = "Reuters Live Wire";
                            var linkLower = (item.link || "").toLowerCase();
                            var titleLower = (item.title || "").toLowerCase();

                            if (linkLower.indexOf("bloomberg") !== -1 || titleLower.indexOf("bloomberg") !== -1) {
                                vendor = "Bloomberg";
                                sourceName = "Bloomberg Markets";
                            } else if (linkLower.indexOf("wsj") !== -1 || titleLower.indexOf("wall street journal") !== -1 || titleLower.indexOf("wsj") !== -1) {
                                vendor = "WSJ";
                                sourceName = "WSJ Markets";
                            } else if (linkLower.indexOf("cnbc") !== -1 || titleLower.indexOf("cnbc") !== -1) {
                                vendor = "CNBC";
                                sourceName = "CNBC Finance";
                            } else if (linkLower.indexOf("reuters") !== -1 || titleLower.indexOf("reuters") !== -1) {
                                vendor = "Reuters";
                                sourceName = "Reuters Business";
                            }

                            fetchedList.push({
                                titleEn: cleanTitle,
                                titleKo: translateTitleToKorean(cleanTitle),
                                link: item.link,
                                desc: cleanDesc,
                                vendor: vendor,
                                source: sourceName,
                                timeKST: formatKST(item.pubDate),
                                summaryKo: generateKoreanSummary(cleanTitle, cleanDesc),
                                deepAnalysis: generateDeepDiveAnalysis(cleanTitle, cleanDesc),
                                timestamp: new Date(item.pubDate || Date.now()).getTime()
                            });
                        }
                    }
                } catch (e) {}
            }

            if (banner) banner.style.display = "none";

            if (fetchedList.length > 0) {
                var uniqueMap = {};
                var cleanList = [];
                for (var k = 0; k < fetchedList.length; k++) {
                    if (!uniqueMap[fetchedList[k].link]) {
                        uniqueMap[fetchedList[k].link] = true;
                        cleanList.push(fetchedList[k]);
                    }
                }
                cleanList.sort(function(a, b) { return b.timestamp - a.timestamp; });
                liveArticles = cleanList;
                renderCards();

                var updateLabel = document.getElementById("last-updated-label");
                if (updateLabel) updateLabel.textContent = "실시간 동기화 완료 (" + new Date().toLocaleTimeString() + ")";
            }
        }

        function renderCards() {
            var container = document.getElementById("news-container");
            if (!container) return;

            var filtered = liveArticles.filter(function(a) {
                var matchVendor = (currentFilter === "ALL" || a.vendor === currentFilter);
                var q = searchQuery.toLowerCase();
                var text = (a.titleEn + " " + a.titleKo + " " + a.desc + " " + a.summaryKo).toLowerCase();
                var matchSearch = !q || text.indexOf(q) !== -1;
                return matchVendor && matchSearch;
            });

            var countEl = document.getElementById("article-count-label");
            if (countEl) countEl.innerHTML = "🟢 실시간 속보 <b>" + filtered.length + "건</b> 모니터링 중";

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b; font-size:13px;">선택하신 언론사의 일치하는 실시간 외신 기사가 없습니다.</div>';
                return;
            }

            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var it = filtered[i];
                var searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(it.titleEn);

                html += '<div class="card" data-vendor="' + it.vendor + '">' +
                    '<div class="card-header">' +
                        '<div class="tag-wrap"><span class="tag tag-' + it.vendor + '">' + it.source + '</span></div>' +
                        '<div class="quick-actions">' +
                            '<button class="action-chip" onclick="copyPrompt(\'' + it.link + '\')">📋 복사</button>' +
                            '<a class="action-chip" href="' + searchUrl + '" target="_blank" rel="noopener noreferrer">🔍 검색</a>' +
                            '<a class="action-chip chip-origin" href="' + it.link + '" target="_blank" rel="noopener noreferrer">원문 ↗</a>' +
                        '</div>' +
                    '</div>' +

                    '<div class="time-meta-bar">' +
                        '<div class="time-item"><span class="time-label">⚡ 외신 타전 시각 (KST):</span><span class="time-val">' + it.timeKST + '</span></div>' +
                    '</div>' +

                    /* 영문 원문 제목 먼저 배치, 그 아래 자연스러운 한글 번역 제목 배치 */
                    '<div class="article-original">' +
                        '<a class="article-title-en" href="' + it.link + '" target="_blank" rel="noopener noreferrer">🌐 ' + it.titleEn + '</a>' +
                        '<div class="article-title-ko">' + it.titleKo + '</div>' +
                    '</div>' +

                    /* 기사 실시간 요약 (순수 국어) */
                    '<div class="article-korean-summary">' +
                        '<div class="korean-summary-badge"><span>🇰🇷 AI 기사 실시간 요약 & 시사점</span></div>' +
                        '<div class="korean-summary-text">' + it.summaryKo + '</div>' +
                    '</div>' +

                    /* 아코디언: 원문 기반 상세 분석 및 영문 원문 보기 */
                    '<details class="reader-accordion">' +
                        '<summary class="reader-summary">📖 기사 원문 상세 분석 보기</summary>' +
                        '<div class="accordion-content">' +
                            '<div class="sub-box sub-box-analysis">' + it.deepAnalysis + '</div>' +
                            '<div class="sub-box sub-box-en"><b>🌐 [Raw English Excerpt]</b>\n' + it.titleEn + '.\n\n' + it.desc + '\n\n🔗 Source Link: ' + it.link + '</div>' +
                        '</div>' +
                    '</details>' +
                '</div>';
            }

            container.innerHTML = html;
        }

        function copyPrompt(url) {
            window.prompt("아래 기사 주소를 복사하세요:", url);
        }

        function filterCards(vendor, btn) {
            currentFilter = vendor;
            var buttons = document.querySelectorAll(".filter-btn");
            for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
            btn.classList.add("active");
            renderCards();
        }

        function searchCards(val) {
            searchQuery = (val || "").trim();
            renderCards();
        }

        setInterval(function() {
            countdown--;
            var timerEl = document.getElementById("next-timer");
            if (countdown <= 0) {
                countdown = 60;
                fetchLiveNews();
            }
            if (timerEl) timerEl.textContent = countdown + "초 후 갱신";
        }, 1000);

        fetchLiveNews();
    </script>
