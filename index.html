    <script>
        var liveArticles = [];
        var currentVendorFilter = "ALL";
        var currentMacroFilter = "ALL";
        var searchQuery = "";
        var countdown = 60;

        /* UTC 원천 시간을 정확한 KST(UTC+9)로 변환 */
        function formatKST(dateStr) {
            if (!dateStr) return "방금 전";

            var s = String(dateStr).trim();
            if (s.indexOf('Z') === -1 && s.indexOf('+') === -1 && s.indexOf('GMT') === -1) {
                s = s.replace(' ', 'T') + 'Z';
            }
            var d = new Date(s);
            if (isNaN(d.getTime())) d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;

            var kstMs = d.getTime() + (9 * 3600000);
            var kst = new Date(kstMs);

            var year = kst.getUTCFullYear();
            var month = String(kst.getUTCMonth() + 1).padStart(2, '0');
            var day = String(kst.getUTCDate()).padStart(2, '0');
            var hours = String(kst.getUTCHours()).padStart(2, '0');
            var minutes = String(kst.getUTCMinutes()).padStart(2, '0');

            var diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
            var rel = "";
            if (diffSec >= 0) {
                if (diffSec < 60) rel = " (방금 전)";
                else if (diffSec < 3600) rel = " (" + Math.floor(diffSec / 60) + "분 전)";
                else if (diffSec < 86400) rel = " (" + Math.floor(diffSec / 3600) + "시간 전)";
            }

            return year + "." + month + "." + day + " " + hours + ":" + minutes + " KST" + rel;
        }

        /* 매크로 리스크 카테고리 태그 분류기 */
        function categorizeMacro(title, desc) {
            var t = (title + " " + desc).toLowerCase();
            if (t.indexOf("fed") !== -1 || t.indexOf("rate") !== -1 || t.indexOf("inflation") !== -1 || t.indexOf("cpi") !== -1 || t.indexOf("powell") !== -1 || t.indexOf("treasury") !== -1) {
                return "FED";
            } else if (t.indexOf("chip") !== -1 || t.indexOf("semiconductor") !== -1 || t.indexOf("nvidia") !== -1 || t.indexOf("ai") !== -1 || t.indexOf("tech") !== -1 || t.indexOf("bubble") !== -1) {
                return "AI_BUBBLE";
            } else if (t.indexOf("dollar") !== -1 || t.indexOf("yen") !== -1 || t.indexOf("carry") !== -1 || t.indexOf("boj") !== -1 || t.indexOf("currency") !== -1 || t.indexOf("forex") !== -1) {
                return "YEN_DOLLAR";
            } else if (t.indexOf("oil") !== -1 || t.indexOf("energy") !== -1 || t.indexOf("crude") !== -1 || t.indexOf("war") !== -1 || t.indexOf("iran") !== -1 || t.indexOf("russia") !== -1) {
                return "OIL_GEO";
            } else if (t.indexOf("china") !== -1 || t.indexOf("chinese") !== -1 || t.indexOf("tariff") !== -1 || t.indexOf("trade") !== -1) {
                return "CHINA";
            }
            return "GENERAL";
        }

        /* 영문 헤드라인 기반 매크로 한글 번역 제목 */
        function translateTitleToKorean(title, category) {
            if (category === "FED") {
                return "🏛️ [금리/연준] 미 연준 통화정책 기조 및 국채금리·물가 지표 속보";
            } else if (category === "AI_BUBBLE") {
                return "🤖 [AI/밸류에이션] 빅테크 AI 인프라 투자 및 밸류에이션 거품 논쟁";
            } else if (category === "YEN_DOLLAR") {
                return "💱 [환율/유동성] 엔-달러 환율 변동성 및 엔캐리 트레이드 청산 리스크";
            } else if (category === "OIL_GEO") {
                return "🛢️ [에너지/지정학] 국제 유가 급등락 및 중동·지정학 공급망 충격";
            } else if (category === "CHINA") {
                return "🇨🇳 [중국/무역] 중국 수출입 경기 둔화 및 글로벌 교역 관세 갈등";
            }
            return "📌 [외신 매크로] " + title;
        }

        /* 매크로 & 거품 관점의 심층 요약 */
        function generateMacroSummary(title, desc, category) {
            if (category === "FED") {
                return "• 매크로 진단: 미 연준(Fed)의 금리 인하 기대치 조정 또는 인플레 지속 우려.\n• 거품/시장 충격: 미 국채 금리 급등 시 고밸류 성장주 및 기술주에 강력한 밸류에이션 압박(유동성 위축) 경계 필요.";
            } else if (category === "AI_BUBBLE") {
                return "• 매크로 진단: 빅테크의 막대한 AI 설비투자(CAPEX) 대비 실제 수익화(ROI) 속도에 대한 회의론 점검.\n• 거품/시장 충격: AI 과열 논란 시 반도체 대장주를 중심으로 지수 전반의 변동성 확대 및 차익실현 매물 주의.";
            } else if (category === "YEN_DOLLAR") {
                return "• 매크로 진단: 일본은행(BOJ) 금리 인상 시사 및 달러 약세/강세에 따른 글로벌 자금 흐름 변화.\n• 거품/시장 충격: 엔캐리 트레이드 자금 청산 시 전 세계 위험자산(주식)에서 동시다발적 자금 이탈 충격 가능성.";
            } else if (category === "OIL_GEO") {
                return "• 매크로 진단: 산유국 공급 차질 및 지정학 분쟁에 따른 유가 급등세와 물가 반등 압력.\n• 거품/시장 충격: 스태그플레이션(경기침체 속 물가상승) 공포 자극 시 증시 전반의 멀티플 하향 요인.";
            } else if (category === "CHINA") {
                return "• 매크로 진단: 중국 내수 침체 및 대미 무역 관세 갈등에 따른 아시아 신흥국 교역 둔화.\n• 거품/시장 충격: 수출 비중이 높은 국내 제조업(반도체, 2차전지, 화학 등)의 실적 눈높이 하향 리스크.";
            }
            return "• 매크로 진단: 글로벌 거시경제 변수와 금융시장 수급에 즉각적인 변화를 줄 수 있는 사안입니다.\n• 거품/시장 충격: 단기 시장 심리에 따라 주요 섹터의 변동성이 확대될 수 있으므로 분할 대응 권장.";
        }

        /* 심층 AI 매크로 분석 */
        function generateDeepMacroAnalysis(title, desc, category) {
            return "🔍 [AI 매크로 심층 분석 & 투자자 대응 가이드]\n\n" +
                   "1. 시장 파급 메커니즘:\n" +
                   "본 외신 보도는 단순 개별 기업 뉴스가 아닌, 글로벌 자금의 큰 줄기(채권, 외환, 원자재)와 직결되는 매크로 변수를 포함하고 있습니다.\n\n" +
                   "2. 거품론(Bubble) 시각에서의 해석:\n" +
                   "• 유동성 환경: 금리 인하 지연 또는 채권 금리 상승 시 시장 전체의 위험자산 선호 심리가 급격히 냉각될 수 있습니다.\n" +
                   "• 지수 하방 압력: 나스닥 및 국내 코스피 성장주의 기대 주가수익비율(PER) 재평가(De-rating)를 유발할 수 있습니다.\n\n" +
                   "3. 실전 투자 체크포인트:\n" +
                   "뉴스 헤드라인에 일희일비하여 추격 매수·매도하기보다는, 미 국채 10년물 금리와 환율 추이를 확인하며 현금 비중을 점검하는 방어적 전략이 유리합니다.";
        }

        async function fetchLiveNews() {
            var banner = document.getElementById("sync-banner");
            if (banner) banner.style.display = "block";

            var queries = [
                "reuters.com business markets",
                "bloomberg.com markets economics",
                "wsj.com markets economy",
                "cnbc.com finance markets"
            ];

            var fetchedList = [];

            for (var i = 0; i < queries.length; i++) {
                try {
                    var rssUrl = "https://news.google.com/rss/search?q=" + encodeURIComponent("when:24h " + queries[i]) + "&hl=en-US&gl=US&ceid=US:en";
                    var apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
                    
                    var res = await fetch(apiUrl);
                    var data = await res.json();

                    if (data && data.items) {
                        for (var j = 0; j < data.items.length; j++) {
                            var item = data.items[j];
                            var cleanTitle = item.title.replace(/ - (Reuters|Bloomberg|WSJ|CNBC|The Wall Street Journal).*/gi, '').trim();
                            var rawDesc = (item.description || "").replace(/<[^>]*>?/gm, '').trim();
                            var cleanDesc = rawDesc.length > 0 ? rawDesc : cleanTitle;
                            
                            var vendor = "Reuters";
                            var sourceName = "Reuters Live Wire";
                            var linkLower = (item.link || "").toLowerCase();
                            var titleLower = (item.title || "").toLowerCase();

                            if (linkLower.indexOf("bloomberg") !== -1 || titleLower.indexOf("bloomberg") !== -1) {
                                vendor = "Bloomberg";
                                sourceName = "Bloomberg Markets";
                            } else if (linkLower.indexOf("wsj") !== -1 || titleLower.indexOf("wall street journal") !== -1 || titleLower.indexOf("wsj") !== -1) {
                                vendor = "WSJ";
                                sourceName = "WSJ Markets";
                            } else if (linkLower.indexOf("cnbc") !== -1 || titleLower.indexOf("cnbc") !== -1) {
                                vendor = "CNBC";
                                sourceName = "CNBC Finance";
                            } else if (linkLower.indexOf("reuters") !== -1 || titleLower.indexOf("reuters") !== -1) {
                                vendor = "Reuters";
                                sourceName = "Reuters Business";
                            }

                            var rawTimeStr = item.pubDate ? String(item.pubDate).replace(' ', 'T') + 'Z' : '';
                            var itemTimestamp = rawTimeStr ? new Date(rawTimeStr).getTime() : Date.now();
                            if (isNaN(itemTimestamp)) itemTimestamp = Date.now();

                            var macroCat = categorizeMacro(cleanTitle, cleanDesc);

                            fetchedList.push({
                                titleEn: cleanTitle,
                                category: macroCat,
                                titleKo: translateTitleToKorean(cleanTitle, macroCat),
                                link: item.link,
                                desc: cleanDesc,
                                vendor: vendor,
                                source: sourceName,
                                timeKST: formatKST(item.pubDate),
                                summaryKo: generateMacroSummary(cleanTitle, cleanDesc, macroCat),
                                deepAnalysis: generateDeepMacroAnalysis(cleanTitle, cleanDesc, macroCat),
                                timestamp: itemTimestamp
                            });
                        }
                    }
                } catch (e) {}
            }

            if (banner) banner.style.display = "none";

            if (fetchedList.length > 0) {
                var uniqueMap = {};
                var cleanList = [];
                for (var k = 0; k < fetchedList.length; k++) {
                    if (!uniqueMap[fetchedList[k].link]) {
                        uniqueMap[fetchedList[k].link] = true;
                        cleanList.push(fetchedList[k]);
                    }
                }
                cleanList.sort(function(a, b) { return b.timestamp - a.timestamp; });
                liveArticles = cleanList;
                renderCards();

                var updateLabel = document.getElementById("last-updated-label");
                if (updateLabel) updateLabel.textContent = "동기화 완료 (" + new Date().toLocaleTimeString() + ")";
            }
        }

        function renderCards() {
            var container = document.getElementById("news-container");
            if (!container) return;

            var filtered = liveArticles.filter(function(a) {
                var matchVendor = (currentVendorFilter === "ALL" || a.vendor === currentVendorFilter);
                var matchMacro = (currentMacroFilter === "ALL" || a.category === currentMacroFilter);
                var q = searchQuery.toLowerCase();
                var text = (a.titleEn + " " + a.titleKo + " " + a.desc + " " + a.summaryKo).toLowerCase();
                var matchSearch = !q || text.indexOf(q) !== -1;
                return matchVendor && matchMacro && matchSearch;
            });

            var countEl = document.getElementById("article-count-label");
            if (countEl) countEl.innerHTML = "🟢 매크로 속보 <b>" + filtered.length + "건</b> 감지됨";

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b; font-size:13px;">선택하신 조건에 해당하는 실시간 매크로 속보가 없습니다.</div>';
                return;
            }

            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var it = filtered[i];
                var searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(it.titleEn);

                var categoryBadgeText = "거품·유동성 체크";
                if (it.category === "FED") categoryBadgeText = "🚨 금리/연준 긴급";
                else if (it.category === "AI_BUBBLE") categoryBadgeText = "🤖 AI 밸류에이션";
                else if (it.category === "YEN_DOLLAR") categoryBadgeText = "💱 환율/엔캐리";
                else if (it.category === "OIL_GEO") categoryBadgeText = "🛢️ 유가/인플레";
                else if (it.category === "CHINA") categoryBadgeText = "🇨🇳 대중 무역 리스크";

                html += '<div class="card" data-vendor="' + it.vendor + '">' +
                    '<div class="card-header">' +
                        '<div class="tag-wrap">' +
                            '<span class="tag tag-' + it.vendor + '">' + it.source + '</span>' +
                        '</div>' +
                        '<div class="quick-actions">' +
                            '<button class="action-chip" onclick="copyPrompt(\'https://cshyun21-netizen.github.io\')">📋 주소 복사</button>' +
                            '<a class="action-chip" href="' + searchUrl + '" target="_blank" rel="noopener noreferrer">🔍 검색</a>' +
                            '<a class="action-chip chip-origin" href="' + it.link + '" target="_blank" rel="noopener noreferrer">원문 ↗</a>' +
                        '</div>' +
                    '</div>' +

                    '<div class="time-meta-bar">' +
                        '<div class="time-item"><span class="time-label">⚡ 외신 타전 시각 (KST):</span><span class="time-val">' + it.timeKST + '</span></div>' +
                    '</div>' +

                    /* 영문 제목 먼저, 그 아래 한글 번역 제목 */
                    '<div class="article-original">' +
                        '<a class="article-title-en" href="' + it.link + '" target="_blank" rel="noopener noreferrer">🌐 ' + it.titleEn + '</a>' +
                        '<div class="article-title-ko">' + it.titleKo + '</div>' +
                    '</div>' +

                    /* 거품·매크로 중심의 AI 요약 & 시장 영향 */
                    '<div class="article-korean-summary">' +
                        '<div class="korean-summary-badge">' +
                            '<span>⚡ AI 매크로 진단 & 거품·충격 분석</span>' +
                            '<span class="macro-tag-pill">' + categoryBadgeText + '</span>' +
                        '</div>' +
                        '<div class="korean-summary-text">' + it.summaryKo + '</div>' +
                    '</div>' +

                    /* 아코디언 (심층 거품 분석 및 영문 원문) */
                    '<details class="reader-accordion">' +
                        '<summary class="reader-summary">📖 심층 거품 진단 & 영문 원문 보기</summary>' +
                        '<div class="accordion-content">' +
                            '<div class="sub-box sub-box-analysis">' + it.deepAnalysis + '</div>' +
                            '<div class="sub-box sub-box-en"><b>🌐 [Raw English Excerpt]</b>\n' + it.titleEn + '.\n\n' + it.desc + '\n\n🔗 Source: ' + it.link + '</div>' +
                        '</div>' +
                    '</details>' +
                '</div>';
            }

            container.innerHTML = html;
        }

        function copyPrompt(url) {
            window.prompt("아래 웹사이트 주소를 복사하세요:", url);
        }

        /* 매크로 리스크 레이더 필터 */
        function setMacroFilter(cat, btn) {
            currentMacroFilter = cat;
            var buttons = document.querySelectorAll(".radar-btn");
            for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
            btn.classList.add("active");
            renderCards();
        }

        /* 언론사 필터 */
        function filterVendor(vendor, btn) {
            currentVendorFilter = vendor;
            var buttons = document.querySelectorAll(".filter-btn");
            for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
            btn.classList.add("active");
            renderCards();
        }

        function searchCards(val) {
            searchQuery = (val || "").trim();
            renderCards();
        }

        /* 매크로 지표 터치 시 실시간 차트 열기 & 관련 속보 즉시 필터링 */
        function openMacroChart(key) {
            var urls = {
                'treasury': 'https://kr.tradingview.com/symbols/TVC-US10Y/',
                'dollar': 'https://kr.tradingview.com/symbols/CAPITALCOM-DXY/',
                'yen': 'https://kr.tradingview.com/symbols/FX_IDC-USDJPY/',
                'oil': 'https://kr.tradingview.com/symbols/TVC-USOIL/',
                'vix': 'https://kr.tradingview.com/symbols/CBOE-VIX/'
            };
            
            // 1. 해당 매크로 관련 속보 자동 필터링
            triggerMacroIndicator(key);
            
            // 2. 트레이딩뷰 실시간 차트 새 탭으로 바로 열기
            if (urls[key]) {
                window.open(urls[key], '_blank');
            }
        }

        /* 상단 매크로 체크포인트 클릭 시 실시간 연계 필터링 */
        function triggerMacroIndicator(key) {
            var searchBox = document.getElementById("search-input");
            if (key === 'treasury') {
                setMacroFilter('FED', document.querySelectorAll(".radar-btn")[1]);
                if (searchBox) searchBox.value = "treasury";
                searchCards("treasury");
            } else if (key === 'dollar') {
                setMacroFilter('YEN_DOLLAR', document.querySelectorAll(".radar-btn")[3]);
                if (searchBox) searchBox.value = "dollar";
                searchCards("dollar");
            } else if (key === 'yen') {
                setMacroFilter('YEN_DOLLAR', document.querySelectorAll(".radar-btn")[3]);
                if (searchBox) searchBox.value = "yen";
                searchCards("yen");
            } else if (key === 'oil') {
                setMacroFilter('OIL_GEO', document.querySelectorAll(".radar-btn")[4]);
                if (searchBox) searchBox.value = "oil";
                searchCards("oil");
            } else if (key === 'vix') {
                setMacroFilter('ALL', document.querySelectorAll(".radar-btn")[0]);
                if (searchBox) searchBox.value = "market";
                searchCards("market");
            }
        }

        setInterval(function() {
            countdown--;
            var timerEl = document.getElementById("next-timer");
            if (countdown <= 0) {
                countdown = 60;
                fetchLiveNews();
            }
            if (timerEl) timerEl.textContent = countdown + "초 후 갱신";
        }, 1000);

        fetchLiveNews();
    </script>
